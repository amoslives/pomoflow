# Cloudflare Pages / Workers Configuration for Pomodoro Focus
name = "pomoflow"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Bind Cloudflare KV namespace for cross-computer task sync
# The namespace is named "pomoflow-tasks" in Cloudflare.
[[kv_namespaces]]
binding = "TASKS_KV"
id = "8f49902a56604bd397f23a3b7e64bcb2"
