# Cloudflare Pages / Workers Configuration for Pomodoro Focus
name = "pomoflow"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Legacy KV namespace retained for one-time room migration into D1.
# The namespace is named "pomoflow-tasks" in Cloudflare.
[[kv_namespaces]]
binding = "TASKS_KV"
id = "8f49902a56604bd397f23a3b7e64bcb2"

[[d1_databases]]
binding = "TASKS_DB"
database_name = "pomoflow-sync"
database_id = "309478c6-4f5f-4015-902b-db3a4d79f6af"
